<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Witcher 3 Keymapper</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="bg-blur" aria-hidden="true"></div>
  <div class="bg-medallion" aria-hidden="true"></div>
  <header class="topbar" aria-label="Witcher 3 Keymap Editor">
    <div class="topbar-logo" aria-hidden="true"></div>
    <div class="top-actions">
      <label class="language-select">
        <span id="languageLabel">Language</span>
        <select id="languageSelect" aria-label="Language">
          <option value="auto">Auto</option>
          <option value="en">English</option>
          <option value="de">Deutsch</option>
        </select>
      </label>
      <button id="loadFile" type="button">Load</button>
      <button id="saveFile" type="button">Save</button>
      <button id="refresh" class="stacked-action" type="button" title="Reload project input.settings from disk">
        <span>Reload</span>
      </button>
    </div>
  </header>
  <input id="loadInput" type="file" accept=".settings" hidden>

  <div id="loadingBar" class="loading-bar" hidden></div>

  <main>
    <section class="summary" id="stats" aria-label="Overview"></section>

    <section class="panel device-view">
      <div class="panelHead device-head">
        <div class="device-tabs" id="deviceTabs" role="tablist" aria-label="Choose input device">
          <button class="device-tab is-active" data-device="keyboard" role="tab" aria-selected="true">Keyboard</button>
          <button class="device-tab" data-device="controllers" role="tab" aria-selected="false">Mouse/Gamepad</button>
        </div>
        <label class="layout-select hidden" id="layoutSelectWrap">
          <span>Layout</span>
          <select id="layoutSelect" aria-label="Choose keyboard layout">
            <option value="">Choose layout...</option>
            <option value="iso-de-105">ISO-DE 105</option>
            <option value="ansi-us-104">ANSI-US 104</option>
          </select>
        </label>
        <button id="layoutMode" class="layout-mode" type="button" aria-pressed="false">Edit layout</button>
        <div id="editorBar" class="editor-bar hidden" role="toolbar" aria-label="Layout editor">
          <button id="editorFontDown" class="editor-btn" type="button" title="Smaller labels">A−</button>
          <button id="editorFontUp" class="editor-btn" type="button" title="Larger labels">A+</button>
          <label class="editor-grid"><input id="editorGrid" type="checkbox" checked> <span>Snap</span></label>
          <button id="editorReset" class="editor-btn" type="button">Reset</button>
          <span id="editorHint" class="editor-hint"></span>
        </div>
      </div>
      <div class="device-stage">
        <div id="deviceSvg" class="device-svg-host" aria-live="polite"></div>
        <p id="deviceEmpty" class="device-empty hidden"></p>
      </div>
      <div id="legend" class="legend" aria-label="Color legend"></div>
    </section>

    <details class="panel conflicts-panel" id="conflictsPanel" open>
      <summary id="conflictCount">Conflicts</summary>
      <div id="conflicts" class="conflicts"></div>
    </details>

    <section class="toolbar">
        <input id="search" type="search" placeholder="Search action, key, mod, or context">
      <select id="sourceFilter">
        <option value="">All sources</option>
      </select>
      <select id="deviceFilter">
        <option value="">All inputs</option>
        <option value="keyboard">Keyboard</option>
        <option value="mouse">Mouse</option>
        <option value="gamepad">Gamepad</option>
        <option value="unbound">Unbound</option>
      </select>
      <label class="engine-toggle"><input id="engineToggle" type="checkbox"> <span>Show engine bindings</span></label>
    </section>

    <section class="panel mappings-panel">
      <div class="panelHead">
        <h2 id="mappingsTitle">Mappings</h2>
        <span id="resultCount"></span>
      </div>
      <div id="commands" class="commands"></div>
    </section>
  </main>

  <dialog id="remapDialog">
    <form method="dialog" id="remapForm">
      <h2 id="remapTitle">Change mapping</h2>
      <p id="remapText"></p>
      <label>
        New key
        <span class="key-field">
          <input id="newKey" required pattern="IK_[A-Za-z0-9_]+" placeholder="e.g. IK_NumPad3">
          <button type="button" id="captureKey">Press a key</button>
        </span>
      </label>
      <p id="captureHint" class="muted capture-hint"></p>
      <div id="remapPreview" class="remap-preview" aria-live="polite"></div>
      <div class="dialogActions">
        <button value="cancel" formnovalidate>Cancel</button>
        <button id="applyRemap" value="default">Create backup & apply</button>
      </div>
    </form>
  </dialog>

  <dialog id="saveDialog">
    <form method="dialog" id="saveForm">
      <h2>Save input.settings</h2>
      <p id="saveText" class="muted">Enter a target path. Existing files are backed up server-side.</p>
      <label>
        Target path
        <input id="savePath" required placeholder="C:\Path\to\input.settings">
      </label>
      <div class="dialogActions">
        <button value="cancel" formnovalidate>Cancel</button>
        <button id="applySave" value="default">Create backup & save</button>
      </div>
    </form>
  </dialog>

  <script src="/semantic-bindings.js"></script>
  <script src="/semantic-ui-enhancements.js"></script>
  <script src="/app.js"></script>
</body>
</html>
