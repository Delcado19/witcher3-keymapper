<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Witcher 3 Keymapper</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Witcher 3 Keymapper</h1>
      <p id="paths">Lade lokale Dateien...</p>
    </div>
    <button id="refresh">Aktualisieren</button>
  </header>

  <div id="loadingBar" class="loading-bar" hidden></div>

  <main>
    <section class="stats" id="stats"></section>

    <section class="panel device-view">
      <div class="panelHead device-head">
        <div class="device-tabs" id="deviceTabs" role="tablist" aria-label="Eingabegerät wählen">
          <button class="device-tab is-active" data-device="keyboard" role="tab" aria-selected="true">Tastatur</button>
          <button class="device-tab" data-device="mouse" role="tab" aria-selected="false">Maus</button>
          <button class="device-tab" data-device="gamepad" role="tab" aria-selected="false">Gamepad</button>
        </div>
        <label class="layout-select hidden" id="layoutSelectWrap">
          <span>Layout</span>
          <select id="layoutSelect" aria-label="Tastaturlayout wählen">
            <option value="">Layout wählen…</option>
            <option value="iso-de-105">ISO-DE 105</option>
            <option value="ansi-us-104">ANSI-US 104</option>
          </select>
        </label>
      </div>
      <div class="device-stage">
        <div id="deviceSvg" class="device-svg-host" aria-live="polite"></div>
        <p id="deviceEmpty" class="device-empty hidden"></p>
      </div>
      <div id="legend" class="legend" aria-label="Farb-Legende"></div>
    </section>

    <section class="toolbar">
      <input id="search" type="search" placeholder="Aktion, Taste, Mod oder Kontext suchen">
      <select id="sourceFilter">
        <option value="">Alle Quellen</option>
      </select>
      <select id="deviceFilter">
        <option value="">Alle Eingaben</option>
        <option value="keyboard">Tastatur</option>
        <option value="mouse">Maus</option>
        <option value="gamepad">Gamepad</option>
        <option value="unbound">Ungebunden</option>
      </select>
    </section>

    <section class="panel">
      <div class="panelHead">
        <h2>Konflikte</h2>
        <span id="conflictCount"></span>
      </div>
      <div id="conflicts" class="conflicts"></div>
    </section>

    <section class="panel">
      <div class="panelHead">
        <h2>Mappings</h2>
        <span id="resultCount"></span>
      </div>
      <div id="commands" class="commands"></div>
    </section>
  </main>

  <dialog id="remapDialog">
    <form method="dialog" id="remapForm">
      <h2 id="remapTitle">Mapping ändern</h2>
      <p id="remapText"></p>
      <label>
        Neue Taste im Witcher-Format
        <input id="newKey" required pattern="IK_[A-Za-z0-9_]+" placeholder="z.B. IK_NumPad3">
      </label>
      <div class="dialogActions">
        <button value="cancel">Abbrechen</button>
        <button id="applyRemap" value="default">Backup erstellen & ändern</button>
      </div>
    </form>
  </dialog>

  <script src="/app.js"></script>
</body>
</html>
